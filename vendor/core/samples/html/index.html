<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Load Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f0e8;
        --panel: #fffdf8;
        --ink: #1f2430;
        --muted: #5c6475;
        --line: #d9d2c4;
        --accent: #0f6b5c;
        --accent-soft: #d9efe9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at top left, #fff8e8, var(--bg) 45%, #e8efe9);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
      }

      .chrome {
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        backdrop-filter: blur(8px);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 12px 16px;
      }

      .toolbar h1 {
        margin: 0 12px 0 0;
        font-size: 16px;
        font-weight: 650;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
        align-items: end;
        padding: 0 16px 12px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 120px;
      }

      .control-group[hidden] {
        display: none !important;
      }

      .control-group label,
      .control-group .label {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .toolbar button,
      .toolbar label.file-btn,
      .controls button,
      .controls select,
      .controls input[type="number"],
      .controls input[type="color"] {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 11px;
        font-size: 13px;
        cursor: pointer;
      }

      .controls select,
      .controls input[type="number"] {
        min-width: 96px;
        cursor: default;
      }

      .controls input[type="color"] {
        padding: 2px;
        width: 42px;
        height: 34px;
      }

      .toolbar button.primary,
      .controls button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .controls button.active {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        color: var(--accent);
      }

      .toolbar button:disabled,
      .controls button:disabled,
      .toolbar label.file-btn:has(input:disabled) {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .toolbar input[type="file"] {
        display: none;
      }

      #status {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        max-width: min(520px, 100%);
        text-align: right;
        word-break: break-all;
      }

      #status.error {
        color: #b42318;
      }

      #status.ok {
        color: var(--accent);
      }

      #reader-root {
        min-height: 0;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <div class="toolbar">
        <h1>HTML Load Test</h1>
        <button id="btn-sample" class="primary" type="button">Load Sample HTML</button>
        <label class="file-btn">
          Choose Local HTML
          <input id="file-input" type="file" accept=".html,.htm,.xhtml,text/html" multiple />
        </label>
        <button id="btn-reload" type="button" disabled>Reload</button>
        <div id="status">Ready</div>
      </div>

      <div class="controls">
        <div class="control-group">
          <span class="label">Layout Mode</span>
          <div class="control-row">
            <button id="btn-layout-scroll" type="button" class="active" data-flip-mode="scroll">Scroll</button>
            <button id="btn-layout-page" type="button" data-flip-mode="page">Paged</button>
          </div>
        </div>

        <div class="control-group" id="columns-control" hidden>
          <label for="select-columns">Columns</label>
          <select id="select-columns">
            <option value="auto" selected>Auto</option>
            <option value="1">1 Column</option>
            <option value="2">2 Columns</option>
            <option value="3">3 Columns</option>
          </select>
        </div>

        <div class="control-group">
          <label for="select-style-preset">Style Preset</label>
          <select id="select-style-preset">
            <option value="default" selected>Default</option>
            <option value="night">Night</option>
            <option value="sepia">Sepia</option>
          </select>
        </div>

        <div class="control-group">
          <label for="select-layout-preset">Typography Preset</label>
          <select id="select-layout-preset">
            <option value="default" selected>Default</option>
            <option value="large">Large Type</option>
            <option value="compact">Compact</option>
          </select>
        </div>

        <div class="control-group">
          <label for="input-font-size">Font Size (px)</label>
          <input id="input-font-size" type="number" min="12" max="36" step="1" value="18" />
        </div>

        <div class="control-group">
          <label for="input-line-height">Line Height (em)</label>
          <input id="input-line-height" type="number" min="1" max="3" step="0.05" value="1.65" />
        </div>

        <div class="control-group">
          <label for="input-paragraph-spacing">Paragraph Spacing (em)</label>
          <input id="input-paragraph-spacing" type="number" min="0" max="2" step="0.05" value="0.5" />
        </div>

        <div class="control-group">
          <label for="input-bg-color">Background</label>
          <input id="input-bg-color" type="color" value="#ffffff" />
        </div>

        <div class="control-group">
          <span class="label">Style Actions</span>
          <div class="control-row">
            <button id="btn-reset-style" type="button">Reset Style</button>
          </div>
        </div>
      </div>
    </div>

    <div id="reader-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
