<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Load Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f0e8;
        --panel: #fffdf8;
        --ink: #1f2430;
        --muted: #5c6475;
        --line: #d9d2c4;
        --accent: #0f6b5c;
        --accent-soft: #d9efe9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at top left, #fff8e8, var(--bg) 45%, #e8efe9);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
      }

      .chrome {
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        backdrop-filter: blur(8px);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 12px 16px;
      }

      .toolbar h1 {
        margin: 0 12px 0 0;
        font-size: 16px;
        font-weight: 650;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
        align-items: end;
        padding: 0 16px 12px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 120px;
      }

      .control-group label,
      .control-group .label {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .toolbar button,
      .toolbar label.file-btn,
      .controls button,
      .controls select,
      .controls input[type="number"] {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 11px;
        font-size: 13px;
        cursor: pointer;
      }

      .controls select,
      .controls input[type="number"] {
        min-width: 96px;
        cursor: default;
      }

      .controls input[type="number"].page-input {
        width: 72px;
        min-width: 72px;
        text-align: center;
      }

      .toolbar button.primary,
      .controls button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .controls button.active {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        color: var(--accent);
      }

      .toolbar button:disabled,
      .controls button:disabled,
      .toolbar label.file-btn:has(input:disabled) {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .toolbar input[type="file"] {
        display: none;
      }

      #status {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        max-width: min(520px, 100%);
        text-align: right;
        word-break: break-all;
      }

      #status.error {
        color: #b42318;
      }

      #status.ok {
        color: var(--accent);
      }

      #reader-root {
        position: relative;
        min-height: 0;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <div class="toolbar">
        <h1>PDF Load Test</h1>
        <button id="btn-sample" class="primary" type="button">Load Sample PDF</button>
        <label class="file-btn">
          Choose Local PDF
          <input id="file-input" type="file" accept=".pdf,application/pdf" />
        </label>
        <button id="btn-reload" type="button" disabled>Reload</button>
        <div id="status">Ready</div>
      </div>

      <div class="controls">
        <div class="control-group">
          <span class="label">Scroll Direction</span>
          <div class="control-row">
            <button id="btn-scroll-vertical" type="button" class="active" data-scroll-mode="vertical">
              Vertical
            </button>
            <button id="btn-scroll-horizontal" type="button" data-scroll-mode="horizontal">
              Horizontal
            </button>
          </div>
        </div>

        <div class="control-group">
          <span class="label">Spread Mode</span>
          <div class="control-row">
            <button id="btn-spread-single" type="button" class="active" data-spread-mode="single">
              Single
            </button>
            <button id="btn-spread-double" type="button" data-spread-mode="double">Double</button>
            <button id="btn-spread-book" type="button" data-spread-mode="doubleBook">Book</button>
          </div>
        </div>

        <div class="control-group">
          <label for="select-zoom">Zoom</label>
          <select id="select-zoom">
            <option value="auto" selected>Auto</option>
            <option value="page-fit">Fit Page</option>
            <option value="page-width">Fit Width</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
          </select>
        </div>

        <div class="control-group">
          <span class="label">Zoom Actions</span>
          <div class="control-row">
            <button id="btn-zoom-out" type="button">Zoom Out</button>
            <button id="btn-zoom-in" type="button">Zoom In</button>
            <button id="btn-zoom-reset" type="button">Reset</button>
          </div>
        </div>

        <div class="control-group">
          <span class="label">Pages</span>
          <div class="control-row">
            <button id="btn-page-prev" type="button">Previous</button>
            <input id="input-page" class="page-input" type="number" min="1" step="1" value="1" />
            <span id="page-total" class="label">/ -</span>
            <button id="btn-page-next" type="button">Next</button>
          </div>
        </div>

        <div class="control-group">
          <span class="label">Rotate</span>
          <div class="control-row">
            <button id="btn-rotate-left" type="button">Rotate Left 90°</button>
            <button id="btn-rotate-right" type="button">Rotate Right 90°</button>
          </div>
        </div>
      </div>
    </div>

    <div id="reader-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
