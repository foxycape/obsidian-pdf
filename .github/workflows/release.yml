name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin assets
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css
          # Obsidian community installs only these three files.
          if [ -d dist/locales ] || [ -d dist/pdfjs ] || [ -d dist/static ]; then
            echo "Unexpected sidecar asset directories in dist/" >&2
            ls -la dist/
            exit 1
          fi
          mkdir -p release-assets
          cp dist/main.js dist/manifest.json dist/styles.css release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
