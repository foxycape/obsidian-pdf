name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin assets
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css
          test -f dist/foxycape-pdf-assets.zip
          test -f dist/pdfjs/pdf.worker.min.mjs
          test -f dist/static/signer.js
          test -d dist/pdfjs/cmaps
          test -d dist/pdfjs/standard_fonts
          mkdir -p release-assets
          # Community installer only consumes these three files.
          cp dist/main.js dist/manifest.json dist/styles.css release-assets/
          # Sidecar zip is fetched when the on-disk pdf.js/signer id mismatches.
          cp dist/foxycape-pdf-assets.zip release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
            release-assets/foxycape-pdf-assets.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
